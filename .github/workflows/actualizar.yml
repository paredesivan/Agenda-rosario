              bundle = json.loads(gzip.decompress(base64.b64decode('')))
              staged, backups = {}, {}
              for entry in bundle:
                  path = Path(entry['path'])
                  original = path.read_text() if path.exists() else ''
                  digest = hashlib.sha256(original.encode()).hexdigest()
                  if digest == entry['after']:
                      continue
                  if digest != entry['before']:
                      raise RuntimeError(f"{path} cambió desde la revisión; no se sobrescribió ningún archivo")
                  lines = original.splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = replacement
                  result = ''.join(lines)
                  assert hashlib.sha256(result.encode()).hexdigest() == entry['after']
                  ast.parse(result, filename=str(path)) if path.suffix == '.py' else json.loads(result)
                  staged[path] = result
                  backups[path] = path.read_bytes() if path.exists() else None
              try:
                  for path, result in staged.items():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      temporary = path.with_suffix(path.suffix + '.reparacion.tmp')
                      temporary.write_text(result)
                      os.replace(temporary, path)
                  receipt.parent.mkdir(exist_ok=True)
                  receipt.write_text(json.dumps({'version': VERSION, 'archivos': [e['path'] for e in bundle]}, indent=2)+'\n')
              except BaseException:
                  for path, original in backups.items():
                      if original is None:
                          path.unlink(missing_ok=True)
                      else:
                          path.write_bytes(original)
                  raise
              print('Reparación instalada en el checkout; se guardará únicamente después de las pruebas.')
