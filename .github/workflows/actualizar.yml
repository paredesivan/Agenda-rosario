                          path.unlink(missing_ok=True)
                      else:
                          path.write_bytes(original)
                  raise
              print('Reparación instalada en el checkout; se guardará únicamente después de las pruebas.')
          PY

      - name: Resolver pendientes sin intervención manual 2026.10.31-6
        run: |
          python - <<'PY'
          import ast, base64, gzip, hashlib, json, os
          from pathlib import Path
          VERSION = '2026.10.31-cola-autonoma-6'
          receipt = Path('.agenda/instalacion_cola_autonoma.json')
          if receipt.exists() and json.loads(receipt.read_text()).get('version') == VERSION:
