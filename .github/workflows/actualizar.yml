      - name: Descubrir y actualizar automáticamente 2026.10.31-5
        run: |
          python - <<'PY'
          import ast, base64, gzip, hashlib, json, os
          from pathlib import Path
          VERSION = '2026.10.31-descubrimiento-automatico-5'
