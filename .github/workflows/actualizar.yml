name: Actualizar agenda

on:
  push:
    branches: [main]
    paths:
      - actualizar_eventos.py
      - requirements.txt
      - tests/**
      - .github/workflows/actualizar.yml
  schedule:
    # GitHub interpreta este horario en UTC: cada dos horas, minuto 17.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Verificar extracción de fechas y eventos
        if: hashFiles('tests/**/*.py') != ''
        run: python -m unittest discover -s tests -v

      - name: Actualizar eventos
        run: python actualizar_eventos.py

      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add eventos.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar agenda"
            git push origin HEAD:main
          fi

      - name: Publicar actualización en GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
