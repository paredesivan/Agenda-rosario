name: Actualizar agenda

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar eventos
        run: python actualizar_eventos.py

      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add eventos.json
          git diff --cached --quiet || git commit -m "Actualizar agenda"
          git push
