name: 'Agenda: instalar, comprobar y actualizar'

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.html'
      - '**.css'
      - '**.json'
      - 'requirements.txt'
      - '.github/workflows/actualizar.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
    - cron: '10 12 * * 1'
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué querés hacer'
        type: choice
        options: [actualizar, verificar, auditar]
        default: actualizar

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('agenda-pr-{0}', github.event.number) || 'actualizar-agenda' }}
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      MODO: ${{ github.event_name == 'pull_request' && 'verificar' || github.event.schedule == '10 12 * * 1' && 'auditar' || inputs.accion || 'actualizar' }}
    steps:
      - name: Descargar la versión que inició esta ejecución
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preparar paquete de entrega (1/5)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('w', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (2/5)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (3/5)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (4/5)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (5/5)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Instalar la entrega una sola vez y sin pisar cambios nuevos
        id: instalar
        run: |
          python - <<'PYTHON'
          """Instalador reutilizable: preflight completo, idempotencia y escritura reversible."""
          import gzip
          import hashlib
          import json
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path


          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()


          def ruta_segura(root, name):
              p = Path(name)
              if p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git', '.github'):
                  raise ValueError('Ruta de instalación no permitida')
              dest = root / p
              if dest.is_symlink() or not dest.resolve().is_relative_to(root.resolve()):
                  raise ValueError('La instalación no puede seguir enlaces fuera del proyecto')
              return dest


          def aplicar(payload, root=None):
              root = Path(root or Path.cwd())
              receipt = root / '.agenda/entrega.json'
              previous = json.loads(receipt.read_text()) if receipt.exists() else {}
              if previous.get('version') == payload['version']:
                  print('La entrega ya está instalada. Se conservan las modificaciones posteriores.')
                  return False
              files = payload['files']
              backups = {}
              for name, content in files.items():
                  path = ruta_segura(root, name)
                  original = path.read_bytes() if path.exists() else None
                  digest = blob(original) if original is not None else None
                  expected = payload.get('expected', {}).get(name, [None])
                  if digest not in expected + [blob(content.encode('utf-8'))]:
                      raise ValueError(f'{name} cambió desde la revisión. No se modificó ningún archivo; hay que adaptar esta entrega a la versión nueva.')
                  backups[name] = original
              reports = root / 'reportes'
              reports.mkdir(exist_ok=True)
              public_backup = reports / 'respaldo_publicado.json.gz'
              if not public_backup.exists():
                  publicos = {name: (root / name).read_text(encoding='utf-8')
                              for name in ('index.html', 'agenda.js', 'estilos.css', 'eventos.json', 'estado.html', 'estado_agenda.json')
                              if (root / name).exists()}
                  with gzip.open(public_backup, 'wt', encoding='utf-8') as f:
                      json.dump({'capturado': datetime.now(timezone.utc).isoformat(), 'archivos': publicos}, f, ensure_ascii=False)
              with gzip.open(reports / 'respaldo_instalacion.json.gz', 'wt', encoding='utf-8') as f:
                  json.dump({name: data.decode('utf-8') if data is not None else None for name, data in backups.items()}, f, ensure_ascii=False)
              written = []
              try:
                  for name, content in files.items():
                      path = ruta_segura(root, name)
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with tempfile.NamedTemporaryFile(dir=path.parent, delete=False) as f:
                          f.write(content.encode('utf-8'))
                      try:
                          os.replace(f.name, path)
                      finally:
                          Path(f.name).unlink(missing_ok=True)
                      written.append(name)
                  receipt.parent.mkdir(exist_ok=True)
                  receipt.write_text(json.dumps({'version': payload['version'], 'archivos': sorted(files),
                                                'instalada': datetime.now(timezone.utc).isoformat()}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              except Exception:
                  for name in reversed(written):
                      path = root / name
                      if backups[name] is None: path.unlink(missing_ok=True)
                      else: path.write_bytes(backups[name])
                  raise
              print(f"Entrega {payload['version']}: {len(files)} archivos preparados. Se publicarán sólo después de pasar las pruebas.")
              return True

          import base64
          raw = gzip.decompress(base64.b64decode((Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').read_text()))
          if hashlib.sha256(raw).hexdigest() != 'da2357bae13be8fed1302740d9587b60645c1bebe779c2962771cb834925d32e':
              raise SystemExit('El paquete no coincide con su comprobación de integridad.')
          aplicar(json.loads(raw))
          PYTHON

      - name: Preparar Node para las comprobaciones del navegador
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Guardar respaldo y contexto de esta ejecución
        run: python gestion_agenda.py preparar

      - name: Verificar reglas, extracción y conservación
        id: pruebas
        run: |
          python -m py_compile actualizar_eventos.py actualizacion_segura.py gestion_agenda.py instalar_entrega.py
          node --check agenda.js
          python -m unittest discover -s tests -v

      - name: Actualizar fuentes con conservación de datos
        if: env.MODO == 'actualizar'
        id: actualizar
        run: python -u gestion_agenda.py actualizar

      - name: Ejecutar auditoría de accesos
        if: env.MODO == 'auditar'
        run: python -u gestion_agenda.py auditar

      - name: Generar catálogo HTML y diagnóstico de cobertura
        id: paginas
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from cobertura_actual import generar
          contexto = json.loads(Path('reportes/contexto.json').read_text())
          generar(Path.cwd(), inicio=contexto['inicio'])
          PYTHON
          python generar_paginas.py

      - name: Preparar informe y validar datos
        run: |
          python gestion_agenda.py validar
          python gestion_agenda.py informe --modo "$MODO"
          python medir_peso.py

      - name: Mostrar avisos de fuentes y cobertura
        id: avisos
        run: python gestion_agenda.py avisar

      - name: Reutilizar Chromium entre ejecuciones
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-agenda-chromium-playwright-1.51.0

      - name: Preparar navegador de pruebas
        run: python -m playwright install --with-deps chromium

      - name: Probar agenda y panel en el navegador
        id: navegador
        run: |
          python e2e/test_agenda_browser.py
          python e2e/test_movil.py
          python e2e/test_estado.py
          python e2e/test_espacios.py
          python e2e/test_estaticas.py

      - name: Retirar tareas duplicadas y archivar herramientas antiguas
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python gestion_agenda.py archivar
          python -m unittest discover -s tests -v
          python gestion_agenda.py informe --modo "$MODO"

      - name: Guardar código, datos y diagnóstico validados
        id: guardar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Incluye cache_cm25.json y las demás cachés; nunca fuerza cambios sobre main.
        run: python gestion_agenda.py guardar

      - name: Publicar y confirmar GitHub Pages
        id: publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gestion_agenda.py publicar

      - name: Señalar una actualización o auditoría que no pudo completarse
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          for nombre in ('resultado_actualizacion.json', 'resultado_auditoria.json'):
              archivo = Path('reportes') / nombre
              if archivo.exists() and json.loads(archivo.read_text()).get('estado') == 'fallida':
                  raise SystemExit('Se conservaron los datos anteriores, pero la consulta no terminó. Ver el panel y el informe de esta ejecución.')
          PYTHON

      - name: Dejar un resumen claro aunque algo falle
        if: always()
        env:
          RESULTADO: ${{ job.status }}
          GUARDADO: ${{ steps.guardar.outcome }}
          PUBLICACION: ${{ steps.publicar.outcome }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          destino = Path(os.environ['GITHUB_STEP_SUMMARY'])
          resumen = Path('reportes/resumen.md')
          lineas = [
              '# Agenda: resultado de la ejecución', '',
              'Resultado técnico: **' + os.environ['RESULTADO'] + '**',
              'Guardado: **' + os.environ['GUARDADO'] + '**',
              'Publicación confirmada: **' + ('sí' if os.environ['PUBLICACION'] == 'success' else 'no confirmada en esta ejecución') + '**', '',
              '[Abrir panel del celular](https://salidasrosario.com.ar/estado.html)', '',
              'Si una comprobación falla antes del guardado, esta tarea no publica esos cambios. Si falló la consulta completa, restaura los datos previos y deja el diagnóstico.', '',
              'Los archivos adjuntos contienen el informe, las métricas y el respaldo recibido antes de la entrega.', ''
          ]
          if resumen.exists(): lineas.append(resumen.read_text(encoding='utf-8'))
          with destino.open('a', encoding='utf-8') as f: f.write('\n'.join(lineas) + '\n')
          PYTHON

      - name: Adjuntar diagnóstico y respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            reportes/
            estado_agenda.json
            historial_actualizaciones.json
            salud_actualizacion.json
            COBERTURA_ACTUAL.md
            cobertura_actual.json
            AUDITORIA_FUENTES_20261024.md

