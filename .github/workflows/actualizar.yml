
name: Actualizar agenda

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Actualizar agenda y fuentes complementarias
        run: |
          python actualizar_eventos.py
          python fuentes_nuevas.py
          python precios_ticketek.py

      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add eventos.json fuentes_revisadas.json
          git diff --cached --quiet || git commit -m "Actualizar agenda y fuentes culturales"
          git push
          
