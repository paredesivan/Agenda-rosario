name: 'Agenda: instalar, comprobar y actualizar'

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.js'
      - '**.html'
      - '**.css'
      - '**.json'
      - 'requirements.txt'
      - '.github/workflows/actualizar.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'
    - cron: '10 12 * * 1'
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué querés hacer'
        type: choice
        options: [actualizar, verificar, auditar]
        default: actualizar

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('agenda-pr-{0}', github.event.number) || 'actualizar-agenda' }}
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      MODO: ${{ github.event_name == 'pull_request' && 'verificar' || github.event.schedule == '10 12 * * 1' && 'auditar' || inputs.accion || 'actualizar' }}
    steps:
      - name: Descargar la versión que inició esta ejecución
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preparar paquete de entrega (1/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('w', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (2/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (3/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (4/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (5/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Preparar paquete de entrega (6/6)
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').open('a', encoding='ascii') as f:
              f.write('')
          PYTHON

      - name: Instalar la entrega una sola vez y sin pisar cambios nuevos
        id: instalar
        run: |
          python - <<'PYTHON'
          """Instalador reutilizable: preflight completo, idempotencia y escritura reversible."""
          import gzip
          import hashlib
          import json
          import os
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path


          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()


          def ruta_segura(root, name):
              p = Path(name)
              if p.is_absolute() or '..' in p.parts or p.parts[0] in ('.git', '.github'):
                  raise ValueError('Ruta de instalación no permitida')
              dest = root / p
              if dest.is_symlink() or not dest.resolve().is_relative_to(root.resolve()):
                  raise ValueError('La instalación no puede seguir enlaces fuera del proyecto')
              return dest


          def aplicar(payload, root=None):
              root = Path(root or Path.cwd())
              receipt = root / '.agenda/entrega.json'
              previous = json.loads(receipt.read_text()) if receipt.exists() else {}
              if previous.get('version') == payload['version']:
                  print('La entrega ya está instalada. Se conservan las modificaciones posteriores.')
                  return False
              files = payload['files']
              backups = {}
              for name, content in files.items():
                  path = ruta_segura(root, name)
                  original = path.read_bytes() if path.exists() else None
                  digest = blob(original) if original is not None else None
                  expected = payload.get('expected', {}).get(name, [None])
                  if digest not in expected + [blob(content.encode('utf-8'))]:
                      raise ValueError(f'{name} cambió desde la revisión. No se modificó ningún archivo; hay que adaptar esta entrega a la versión nueva.')
                  backups[name] = original
              reports = root / 'reportes'
              reports.mkdir(exist_ok=True)
              public_backup = reports / 'respaldo_publicado.json.gz'
              if not public_backup.exists():
                  publicos = {name: (root / name).read_text(encoding='utf-8')
                              for name in ('index.html', 'agenda.js', 'estilos.css', 'eventos.json', 'estado.html', 'estado_agenda.json')
                              if (root / name).exists()}
                  with gzip.open(public_backup, 'wt', encoding='utf-8') as f:
                      json.dump({'capturado': datetime.now(timezone.utc).isoformat(), 'archivos': publicos}, f, ensure_ascii=False)
              with gzip.open(reports / 'respaldo_instalacion.json.gz', 'wt', encoding='utf-8') as f:
                  json.dump({name: data.decode('utf-8') if data is not None else None for name, data in backups.items()}, f, ensure_ascii=False)
              written = []
              try:
                  for name, content in files.items():
                      path = ruta_segura(root, name)
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with tempfile.NamedTemporaryFile(dir=path.parent, delete=False) as f:
                          f.write(content.encode('utf-8'))
                      try:
                          os.replace(f.name, path)
                      finally:
                          Path(f.name).unlink(missing_ok=True)
                      written.append(name)
                  receipt.parent.mkdir(exist_ok=True)
                  receipt.write_text(json.dumps({'version': payload['version'], 'archivos': sorted(files),
                                                'instalada': datetime.now(timezone.utc).isoformat()}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              except Exception:
                  for name in reversed(written):
                      path = root / name
                      if backups[name] is None: path.unlink(missing_ok=True)
                      else: path.write_bytes(backups[name])
                  raise
              print(f"Entrega {payload['version']}: {len(files)} archivos preparados. Se publicarán sólo después de pasar las pruebas.")
              return True

          import base64
          raw = gzip.decompress(base64.b64decode((Path(os.environ['RUNNER_TEMP']) / 'agenda_entrega.b64').read_text()))
          if hashlib.sha256(raw).hexdigest() != '32d51c7ede39b6f16c4977754be45e8d087bf672eb3b2dc4a025e348e9a3750a':
              raise SystemExit('El paquete no coincide con su comprobación de integridad.')
          payload = json.loads(raw)
          receipt = Path('.agenda/entrega.json')
          previous = json.loads(receipt.read_text()) if receipt.exists() else {}
          if previous.get('version') != payload['version'] and Path('index.html').exists():
              # El catálogo estático se regenera cada dos horas: conservar su contenido.
              current = Path('index.html').read_text(encoding='utf-8')
              begin, end = '<!-- AGENDA ESTATICA INICIO -->', '<!-- AGENDA ESTATICA FIN -->'
              if current.count(begin) != 1 or current.count(end) != 1:
                  raise ValueError('Marcadores de portada inesperados; no se modificó ningún archivo.')
              a, b = current.index(begin) + len(begin), current.index(end)
              normalized = current[:a] + current[b:]
              current_blob = blob(current.encode('utf-8'))
              destination = payload['files']['index.html']
              if current_blob != blob(destination.encode('utf-8')):
                  if hashlib.sha256(normalized.encode('utf-8')).hexdigest() != payload['index_template_sha256']:
                      raise ValueError('La portada cambió fuera del catálogo; adaptar esta entrega antes de instalar.')
                  x, y = destination.index(begin) + len(begin), destination.index(end)
                  payload['files']['index.html'] = destination[:x] + current[a:b] + destination[y:]
                  payload['expected']['index.html'] = [current_blob]
          aplicar(payload)
          PYTHON

      - name: Preparar Node para las comprobaciones del navegador
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Guardar respaldo y contexto de esta ejecución
        run: python gestion_agenda.py preparar

      - name: Instalar reparación de extracciones 2026.10.31-2
        run: |
          python - <<'PY'
          import ast, base64, gzip, hashlib, json, os
          from pathlib import Path
          VERSION = '2026.10.31-reparacion-extracciones-2'
          receipt = Path('.agenda/reparacion_extracciones.json')
          if receipt.exists() and json.loads(receipt.read_text()).get('version') == VERSION:
              print('Reparación ya instalada; se conservan modificaciones posteriores.')
          else:
              bundle = json.loads(gzip.decompress(base64.b64decode('')))
              staged, backups = {}, {}
              for entry in bundle:
                  path = Path(entry['path'])
                  original = path.read_text() if path.exists() else ''
                  digest = hashlib.sha256(original.encode()).hexdigest()
                  if digest == entry['after']:
                      continue
                  if digest != entry['before']:
                      raise RuntimeError(f"{path} cambió desde la revisión; no se sobrescribió ningún archivo")
                  lines = original.splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      lines[start:end] = replacement
                  result = ''.join(lines)
                  assert hashlib.sha256(result.encode()).hexdigest() == entry['after']
                  ast.parse(result, filename=str(path))
                  staged[path] = result
                  backups[path] = path.read_bytes() if path.exists() else None
              try:
                  for path, result in staged.items():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      temporary = path.with_suffix(path.suffix + '.reparacion.tmp')
                      temporary.write_text(result)
                      os.replace(temporary, path)
                  receipt.parent.mkdir(exist_ok=True)
                  receipt.write_text(json.dumps({'version': VERSION, 'archivos': [e['path'] for e in bundle]}, indent=2)+'\n')
              except BaseException:
                  for path, original in backups.items():
                      if original is None:
                          path.unlink(missing_ok=True)
                      else:
                          path.write_bytes(original)
                  raise
              print('Reparación instalada en el checkout; se guardará únicamente después de las pruebas.')
          PY

