name: Actualizar agenda

on:
  push:
    branches: [main]
    paths:
      - actualizacion_segura.py
      - control_http.py
      - limites_consultas.json
      - medir_peso.py
      - actualizar_eventos.py
      - fuentes_nuevas.py
      - fuentes_refi_folklore.py
      - fuentes_refi_folklore.json
      - fuentes_adicionales.py
      - fuentes_adicionales.json
      - eventos_verificados_adicionales.json
      - precios_lavarden.py
      - precios_ticketek.py
      - requirements.txt
      - tests/**
      - .github/workflows/actualizar.yml
  schedule:
    # GitHub interpreta este horario en UTC: cada dos horas, minuto 17.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # La ejecución completa puede incluir más de 13 fuentes y fichas individuales.
    timeout-minutes: 120
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Verificar extracción de fechas y eventos
        if: hashFiles('tests/**/*.py') != ''
        run: python -m unittest discover -s tests -v

      - name: Actualizar con aislamiento, validación y conservación de datos
        id: actualizar
        run: python -u actualizacion_segura.py

      - name: Conservar diagnóstico y métricas de tamaño
        if: always()
        run: python medir_peso.py

      - name: Adjuntar diagnóstico de actualización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-actualizacion
          path: |
            salud_actualizacion.json
            reportes/

      - name: Guardar cambios
        id: guardar
        if: ${{ !cancelled() && (steps.actualizar.outcome == 'success' || steps.actualizar.outcome == 'failure') }}
        run: |
          # Si hubo otra subida durante la extracción, no publicar datos de código viejo.
          git fetch origin main
          base=$(git rev-parse HEAD)
          if [ "$base" != "$(git rev-parse origin/main)" ]; then
            echo "Hay cambios más nuevos en main; se descarta esta actualización antigua."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          # Incluye cache_cm25.json, cache_refi_folklore.json y las demás cachés existentes.
          for archivo in eventos.json salud_actualizacion.json estado_http.json fuentes_revisadas.json cache_*.json candidatos_*.json revision_*.json verificacion_*.json; do
            if [ -f "$archivo" ]; then git add -- "$archivo"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar agenda"
            if ! git push origin HEAD:main; then
              # Una subida puede llegar entre la comprobación y el push.
              git fetch origin main
              if [ "$base" != "$(git rev-parse origin/main)" ]; then
                echo "main cambió al guardar; se descartan los resultados antiguos sin sobrescribir archivos."
                echo "publicar=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Falló el guardado por una causa distinta a cambios nuevos en main."
              exit 1
            fi
          fi
          echo "publicar=true" >> "$GITHUB_OUTPUT"

      - name: Publicar actualización en GitHub Pages
        if: ${{ success() && steps.guardar.outputs.publicar == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"


