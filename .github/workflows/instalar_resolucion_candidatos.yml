name: Instalar resolución automática de candidatos

# Subir este único archivo a .github/workflows/instalar_resolucion_candidatos.yml.
# Se instala al subirlo a main; también puede ejecutarse con Run workflow.
# No modifica workflows existentes ni eventos.json. Ejecuta todos los tests.
on:
  push:
    branches: [main]
    paths: [.github/workflows/instalar_resolucion_candidatos.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-agenda
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar la versión actual
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Instalar extractores dinámicos y ejecutar todas las pruebas
        env:
          AGENDA_PACKAGE: 
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, sys
          from pathlib import Path
          package = json.loads(base64.b64decode(os.environ['AGENDA_PACKAGE']))
          files = package['files']
          # Verificar todos los archivos antes de escribir: no pisar cambios posteriores.
          for name, text in files.items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts or name.startswith('.github/'):
                  raise SystemExit('Ruta fuera del alcance de este instalador: ' + name)
              previous = package['original'][name]
              if path.exists() and path.read_bytes() == text.encode('utf-8'):
                  continue
              current = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
              if current != previous:
                  raise SystemExit('Cambió ' + name + ' desde la preparación. No se sobrescribe; actualizar el parche.')
          for name, text in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('Instalación validada: seis archivos, sin eventos cargados a mano.')
          PY
      - name: Guardar sólo los cambios validados
        run: |
          git config user.name "agenda-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- actualizacion_segura.py fuentes_adicionales.py fuentes_ampliadas.py resolver_candidatos.py tests/test_resolver_candidatos.py RESOLUCION_CANDIDATOS.md
          if ! git diff --cached --quiet; then
            git commit -m "Resolver candidatos automáticamente sin eventos fijos"
            git push origin HEAD:main
          fi
      - name: Ejecutar Actualizar agenda con los nuevos extractores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/actualizar.yml/dispatches" -f ref=main
