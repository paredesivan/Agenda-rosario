name: Auditar fuentes

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 09:10 de Rosario (UTC-3).
    - cron: "10 12 * * 1"

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Verificar auditoria
        run: python -m unittest discover -s tests -p test_auditoria_fuentes.py -v
      - name: Comprobar robots por dominio
        run: python auditar_fuentes.py --salida auditoria_fuentes.json
      - name: Guardar informe para revision manual
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-fuentes
          path: auditoria_fuentes.json
          retention-days: 30
