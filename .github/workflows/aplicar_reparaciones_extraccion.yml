name: Aplicar reparaciones de extracción verificadas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest requests beautifulsoup4
      - name: Preparar herramientas integradas (sin archivos adicionales)
        run: |
          printf '%s' '' | base64 -d > reparar_extracciones.py
          printf '%s' '' | base64 -d > auditar_extracciones.py
          printf '%s' '' | base64 -d > test_reparaciones_extraccion.py
          printf '%s' '' | base64 -d > ampliar_reparaciones.py
          printf '%s' '' | base64 -d > test_ampliacion.py
      - name: Aplicar reparaciones controladas
        run: python reparar_extracciones.py
      - name: Ampliar reparación de consultas municipales y cola de candidatos
        run: python ampliar_reparaciones.py
      - name: Pruebas específicas de las reparaciones
        run: python -m unittest -v test_reparaciones_extraccion test_ampliacion
      - name: Comprobar sintaxis
        run: python -m compileall -q . -x '(^|/)(archivo|node_modules|\.git)/'
      - name: Ejecutar pruebas del proyecto
        run: python -m pytest -q tests
      - name: Auditoría de los datos existentes
        run: python auditar_extracciones.py
      - name: Guardar únicamente código validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- actualizar_eventos.py fuente_autodromo.py actualizacion_segura.py resolver_candidatos.py auditoria_extracciones.json
          if ! git diff --cached --quiet; then
            git commit -m 'Corregir manejo de fallos y diagnóstico de extracciones'
            git push
          fi
