name: Reparar instalador de extracciones
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir prueba regresiva e instalador
        run: |
          echo '' | base64 -d > /tmp/reparar_instalador.py
          python /tmp/reparar_instalador.py
      - name: Validar y guardar instalador
        run: |
          git diff --check
          grep -q 'Adaptar prueba de la cuota ampliada' .github/workflows/aplicar_reparaciones_extraccion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aplicar_reparaciones_extraccion.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Reparar compatibilidad entre cuota y prueba regresiva'
            git push
          fi
