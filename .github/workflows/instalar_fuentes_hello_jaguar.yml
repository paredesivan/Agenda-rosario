name: Instalar HELLO y Jaguar
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instalacion-fuentes-agenda
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Instalar ambas correcciones
        run: |
          python reparar_agenda_hello.py
          python instalar_horarios_jaguar.py
      - name: Verificar sintaxis y pruebas específicas
        run: |
          python -m py_compile reparar_agenda_hello.py instalar_horarios_jaguar.py fuente_ticketsbravos.py fuente_jaguar.py fuentes_nuevas.py
          python -m unittest discover -s tests -p 'test_ticketsbravos.py' -v
          python -m unittest discover -s tests -p 'test_fuente_jaguar.py' -v
      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eventos.json agenda.js fuentes_nuevas.py
          if ! git diff --cached --quiet; then
            git commit -m 'Integrar HELLO Casa Brava y Jaguar con horario pendiente'
            git push
          fi
