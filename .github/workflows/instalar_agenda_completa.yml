name: Instalar agenda completa
on:
  push:
    branches: [main]
    paths: [.github/workflows/instalar_agenda_completa.yml]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: actualizar-agenda
  cancel-in-progress: true
jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar dependencias
        run: python -m pip install requests beautifulsoup4 playwright==1.51.0
      - name: Instalar todos los cambios acumulados
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('instalar_agenda_completa.py').write_bytes(base64.b64decode(''))
          PY
          python instalar_agenda_completa.py
      - name: Pruebas unitarias y de integración completas
        run: python -m unittest discover -s tests -v
      - name: Preparar navegador de pruebas
        run: python -m playwright install --with-deps chromium
      - name: Pruebas E2E y móviles
        run: |
          python e2e/test_agenda_browser.py
          python e2e/test_movil.py
      - name: Guardar código validado
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main cambió; ejecutar nuevamente esta tarea para preservar las subidas nuevas."
            exit 1
          fi
          # El token de Actions no permite guardar modificaciones de workflows.
          # La agenda existente ya ejecuta los módulos nuevos en cada actualización.
          git restore -- .github/workflows/actualizar.yml
          git config user.name agenda-bot
          git config user.email actions@users.noreply.github.com
          git add fuente_aec.py instalar_fuente_aec.py tests/test_aec.py tests/fixtures/aec/anuncio_factual.html AUDITORIA_AEC.md instalar_agenda_completa.py fuente_passline_venues.py fuentes_ampliadas.py fuentes_ampliadas.json fuentes_adicionales.py fuentes_nuevas.py agenda.js auditar_y_habilitar.py revisiones_fuentes.json instalar_excepciones_robots.py excepciones_robots.json fuente_jaguar.py fuente_ticketsbravos.py instalar_horarios_jaguar.py reparar_agenda_hello.py tests/test_passline_venues.py tests/fixtures/passline/floyd_factual.html tests/test_auditar_y_habilitar.py tests/test_excepciones_robots.py tests/test_fuente_jaguar.py tests/test_ticketsbravos.py AUDITORIA_PASSLINE_SALAS.md
          if ! git diff --cached --quiet; then
            git commit -m "Unificar fuentes, robots auditados, Jaguar, horarios y carteleras Passline"
            git push origin HEAD:main
          fi
      - name: Auditar fuentes candidatas y conservar diagnóstico
        run: python auditar_y_habilitar.py
      - name: Actualizar todas las fuentes con conservación de datos
        id: actualizar
        run: python -u actualizacion_segura.py
      - name: Guardar datos y diagnósticos
        if: ${{ !cancelled() && steps.actualizar.outcome != 'skipped' }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main cambió durante la extracción: se conserva el código y se descarta esta extracción antigua."
            exit 1
          fi
          for archivo in eventos.json salud_actualizacion.json estado_http.json fuentes_revisadas.json auditoria_acceso_resultados.json cache_*.json candidatos_*.json revision_*.json verificacion_*.json; do
            if [ -f "$archivo" ]; then git add -- "$archivo"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar agenda después de integración unificada"
            git push origin HEAD:main
          fi
      - name: Publicar en GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Adjuntar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-agenda-completa
          path: |
            auditoria_acceso_resultados.json
            salud_actualizacion.json
            revision_*.json
            reportes/
